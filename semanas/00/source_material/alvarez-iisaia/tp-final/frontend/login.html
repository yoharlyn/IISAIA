<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acceso al catálogo odontológico">
    <title>Ingresar | DentalHub</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script type="module" src="/assets/js/login.js"></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">D</div>
        <p class="eyebrow">DentalHub</p>
        <h1 id="login-title">Bienvenido</h1>
        <p class="muted">Ingresá para consultar el catálogo de productos odontológicos.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Nombre de usuario</label>
            <input id="username" name="username" autocomplete="username" minlength="3" maxlength="50" required>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="password-control">
              <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
              <button id="toggle-password" class="text-button" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
            </div>
          </div>
          <p id="login-feedback" class="feedback" role="status" aria-live="polite"></p>
          <button id="login-submit" class="primary-button" type="submit">Ingresar</button>
        </form>
      </section>
    </main>
  </body>
</html>
