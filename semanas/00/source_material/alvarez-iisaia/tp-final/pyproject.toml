[project]
name = "coffee-atlas"
version = "0.1.0"
description = "Atlas personal de cafeterías con FastAPI, SQLModel y JavaScript vanilla"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.6.5",
    "fastapi[standard]>=0.116.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
