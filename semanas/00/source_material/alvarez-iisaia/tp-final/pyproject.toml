[project]
name = "odontologia-orders-v1"
version = "0.1.0"
description = "Version 1 dental product catalog with dentist authentication"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.18,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.128,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.46,<3",
  "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
  "html5lib>=1.1,<2",
  "httpx>=0.28,<1",
  "playwright>=1.57,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "tinycss2>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: browser end-to-end tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"] # FastAPI dependency declarations intentionally call Depends/Query/Header.

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/migrations/*"]
